# Environnement de développement : WordPress sur http://localhost:8080, ce dossier monté comme plugin.
#   docker compose up -d
#   docker compose run --rm wpcli wp eval-file wp-content/plugins/image-seo-pro/tests/integration/run.php

services:
  db:
    image: mariadb:10.6
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=somewordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    expose:
      - 3306
      - 33060

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    ports:
      - "8080:80"
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - .:/var/www/html/wp-content/plugins/image-seo-pro
      - wp_data:/var/www/html

  wpcli:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      - db
      - wordpress
    volumes:
      - .:/var/www/html/wp-content/plugins/image-seo-pro
      - wp_data:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress

volumes:
  db_data:
  wp_data:
